<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9C46A" />
      <stop offset="50%" stop-color="#C89D54" />
      <stop offset="100%" stop-color="#9B732B" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Obsidian Badge Background -->
  <rect width="64" height="64" rx="14" fill="#0D0C0B" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Technical Corner Ticks -->
  <line x1="6" y1="12" x2="12" y2="12" stroke="#C89D54" stroke-width="1" stroke-opacity="0.4" />
  <line x1="52" y1="12" x2="58" y2="12" stroke="#C89D54" stroke-width="1" stroke-opacity="0.4" />
  <line x1="6" y1="52" x2="12" y2="52" stroke="#C89D54" stroke-width="1" stroke-opacity="0.4" />
  <line x1="52" y1="52" x2="58" y2="52" stroke="#C89D54" stroke-width="1" stroke-opacity="0.4" />

  <!-- Eye of Horus Outline -->
  <!-- Upper Brow -->
  <path d="M 12 28 C 22 17, 42 17, 52 28" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Lower Eye Arc -->
  <path d="M 12 28 C 22 37, 42 37, 52 28" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Inner Iris Circle (Cyan Beacon Glowing) -->
  <circle cx="32" cy="27.5" r="5.5" fill="none" stroke="url(#cyanGrad)" stroke-width="2" />
  <circle cx="32" cy="27.5" r="2.5" fill="#4CC9F0" filter="url(#glow)" />

  <!-- Eye of Horus Tear Drop Stem & Spiral Tail -->
  <path d="M 28 35 L 28 47" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 38 34 C 44 38, 46 45, 41 48 C 36 50, 33 46, 36 43" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- AR Circuit Trace Accents -->
  <circle cx="28" cy="48" r="1.5" fill="#C89D54" />
  <circle cx="16" cy="24" r="1" fill="#4CC9F0" />
  <circle cx="48" cy="24" r="1" fill="#4CC9F0" />
</svg>
